plugin: amazon.aws.aws_ec2

# Regions to scan - leave empty to scan ALL enabled regions
# regions:
#   - us-east-1
#   - us-west-2

# AWS auth - comes from environment:
#   AWS_PROFILE       (preferred - for SSO)
#   AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY  (fallback)
#   AWS_REGION

# Only include running instances with the cloudlens tag
filters:
  instance-state-name: running
  tag:cloudlens: "yes"

# Hostnames: prefer Name tag, fall back to instance-id
hostnames:
  - tag:Name
  - instance-id

# Group prefixing
keyed_groups:
  # Group by Platform tag: linux-docker, linux-podman, windows
  - prefix: platform
    key: tags.Platform | default('untagged')
  # Group by environment tag
  - prefix: env
    key: tags.env | default('untagged')
  # Group by AWS region
  - prefix: region
    key: placement.region

# Map customer tags to the Ansible groups our playbooks target.
#
# This MUST be "groups", not "conditional_groups". The amazon.aws.aws_ec2
# inventory plugin has no "conditional_groups" option, and an unrecognised
# key is silently ignored rather than rejected: the groups below were never
# created, deploy.yaml matched zero hosts, and the sensor run reported success
# having installed nothing.
groups:
  ubuntu_prod_vms: "tags.os | default('') == 'ubuntu' and tags.env | default('') == 'prod'"
  redhat_prod_vms: "tags.os | default('') == 'rhel' and tags.env | default('') == 'prod'"
  windows_prod_vms: "tags.os | default('') == 'windows' and tags.env | default('') == 'prod'"
  ubuntu_dev_vms:  "tags.os | default('') == 'ubuntu' and tags.env | default('') == 'dev'"
  redhat_dev_vms:  "tags.os | default('') == 'rhel' and tags.env | default('') == 'dev'"
  windows_dev_vms: "tags.os | default('') == 'windows' and tags.env | default('') == 'dev'"

# Convenience host-level facts (used by playbooks)
compose:
  # Reach every host on its public IP when it has one, else the private IP.
  #
  # The control node is usually OUTSIDE the workload VPC (a laptop, or AWS
  # CloudShell, which does not live in your VPC), so a private-IP-only
  # ansible_host makes every Linux host unreachable and the run dies on SSH
  # timeouts. Preferring the public IP works from anywhere, and the private
  # fallback still covers private-subnet fleets reached over VPN, Direct
  # Connect, peering, or an in-VPC jumpbox.
  ansible_host: >-
    public_ip_address if (public_ip_address is defined and public_ip_address != '')
    else private_ip_address
  aws_region: placement.region
  aws_instance_id: instance_id
  aws_private_ip: private_ip_address
  aws_public_ip: public_ip_address | default('', true)
  aws_vpc_id: vpc_id
  aws_subnet_id: subnet_id
