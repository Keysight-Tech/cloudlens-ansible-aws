---
# Windows EC2 instances, any environment (keyed on the os tag) - two connection modes
# Selected at run time by customer_input.yaml -> aws.windows_connection

# Mode: ssm (preferred - no inbound ports, IAM-scoped)
# Requires:  IAM role with AmazonSSMManagedInstanceCore on the instance
#            SSM Agent running (pre-installed on Windows Server 2016+)
#            boto3 + community.aws collection
ansible_connection: "{{ 'community.aws.aws_ssm' if (aws.windows_connection | default('ssm')) == 'ssm' else 'winrm' }}"

# SSM-mode vars
# SSM addresses instances by instance ID, never by IP. ansible_host is the
# public IP so Linux SSH works from outside the VPC, so the instance ID has
# to be supplied separately here. Without it the plugin tries to open an SSM
# session against an IP and the worker dies with the opaque
# "A worker was found in a dead state".
# community.aws.aws_ssm opens a POSIX shell unless told otherwise, even against
# a Windows host. Without this it sends bash to PowerShell: the first thing it
# tries is  PS1='' ; bind 'set enable-bracketed-paste off'  which PowerShell
# never answers, and the host is reported UNREACHABLE on a prompt timeout with
# nothing to suggest the shell type is wrong. Seen live on Server 2022.
# WinRM infers powershell on its own, so this is harmless in that mode.
ansible_shell_type: powershell
ansible_aws_ssm_instance_id: "{{ instance_id }}"
ansible_aws_ssm_region: "{{ aws.regions[0] | default('us-east-1') }}"
# Required, not optional. community.aws.aws_ssm stages every file through S3;
# there is no bucket-less mode. Blank reaches boto3 as bucket "" and dies on
# Gathering Facts with an opaque regex error. playbooks/windows.yaml asserts
# this up front so the message names the fix instead.
ansible_aws_ssm_bucket_name: "{{ aws.ssm_bucket_name | default('') }}"
# Resolved at runtime. A hardcoded /usr/local/bin breaks on Apple Silicon
# (Homebrew installs to /opt/homebrew/bin) and anywhere else the plugin
# lives, failing with "failed to find the executable specified".
# Override explicitly with aws.ssm_plugin_path if it is somewhere unusual.
ansible_aws_ssm_plugin: >-
  {{ aws.ssm_plugin_path
     | default(lookup('pipe', 'command -v session-manager-plugin || echo /usr/local/bin/session-manager-plugin'), true) }}

# WinRM-mode vars (only used if windows_connection = winrm)
ansible_winrm_transport: ntlm
ansible_winrm_server_cert_validation: ignore
ansible_port: 5986
ansible_user: Administrator
# ansible_password: stored in env: ANSIBLE_WINRM_PASSWORD
