name: Check Launch Buttons

# Verifies the docs site's "Launch Stack" buttons actually work.
#
# Why this is SEPARATE from sync-cfn-templates.yml:
#   The sync workflow only fires when a template file changes, and it skips
#   silently (exiting green) when the AWS_ROLE_ARN secret is unset. On
#   2026-09-01 the S3 bucket behind every Launch button was deleted. No
#   template had changed, so nothing ran; nothing checked the live URLs; and
#   the first detection was an SE hitting "The specified bucket does not exist"
#   in front of a customer.
#
#   This job therefore:
#     - runs on a SCHEDULE, so an outage is found without anyone touching git
#     - uses NO credentials and NO secrets, so it can never silently skip
#     - fetches the same public URLs a customer's browser fetches
#
# It cannot fix anything. It exists so we find out before an SE does.

on:
  schedule:
    # 07:00 UTC daily, before the working day in EMEA and the Americas.
    - cron: '0 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'deploy/cloudformation/**.yaml'
      - 'deploy/scripts/check-launch-buttons.sh'
      - 'deploy/scripts/sync-cfn-templates-to-s3.sh'
      - '.github/workflows/check-launch-buttons.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/cloudformation/**.yaml'
      - 'deploy/scripts/sync-cfn-templates-to-s3.sh'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify every Launch Stack template is live and in sync
        run: bash deploy/scripts/check-launch-buttons.sh

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error title=Launch buttons are broken::One or more Launch Stack templates are unreachable or stale."
          echo "Every SE and customer clicking those buttons is hitting an error right now."
          echo ""
          echo "Most likely fix, from a checkout with credentials for the bucket account:"
          echo "  bash deploy/scripts/sync-cfn-templates-to-s3.sh --bootstrap   # bucket or object missing"
          echo "  bash deploy/scripts/sync-cfn-templates-to-s3.sh               # served copy is stale"
