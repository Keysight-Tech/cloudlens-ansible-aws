[defaults]
inventory                  = ./inventory/aws_ec2.yaml
host_key_checking          = False
forks                      = 50
gathering                  = smart
# The bare name "yaml" resolves to community.general.yaml, which was removed in
# community.general 12.0.0 and now aborts every playbook run with a DEPRECATED
# error before any task executes. ansible-core's own default callback provides
# the same YAML-ish output via result_format.
stdout_callback            = default
callback_result_format     = yaml
# profile_tasks and timer also live in community.general and fail to load on
# current collections. The setting is omitted entirely rather than set to an
# empty string, which Ansible reads as one callback named "" and warns about.
deprecation_warnings       = False
retry_files_enabled        = False
roles_path                 = ./roles
collections_path           = ./collections

[inventory]
enable_plugins             = amazon.aws.aws_ec2, host_list, script, auto, yaml, ini, toml

[ssh_connection]
pipelining                 = True
ssh_args                   = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

[persistent_connection]
command_timeout            = 60
connect_timeout            = 60
