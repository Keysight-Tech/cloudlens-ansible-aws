---
# This check lives in its own play, on localhost, with facts off. It cannot go
# in pre_tasks of the play below: Gathering Facts runs BEFORE pre_tasks and is
# itself the thing that opens the SSM connection, so the run dies there before
# any assertion of ours is reached. Verified: the assert never fired.
- name: Check the Windows connection is actually usable
  hosts: localhost
  gather_facts: no
  connection: local
  vars_files:
    - ../vars/cloudlens.yaml
  tasks:
    # community.aws.aws_ssm stages every file through an S3 bucket. There is no
    # bucket-less mode, despite a comment in group_vars that said to leave it
    # blank: blank reaches boto3 as bucket "" and fails on Gathering Facts with
    # 'Invalid bucket name ""' and a regex that says nothing about what to do.
    # Seen live on a real Windows host: ok=0, failed=1, before any task ran.
    - name: SSM needs an S3 bucket, so say so before anything connects
      ansible.builtin.assert:
        that:
          - ((aws | default({})).get('ssm_bucket_name', '') | default('', true)) | length > 0
        fail_msg: >-
          Windows over SSM needs an S3 bucket for file transfer, and none is set.
          Add it to customer_input.yaml:
          aws: {ssm_bucket_name: "your-existing-bucket"}
          The bucket must be in {{ (aws | default({})).get('regions', ['us-east-1'])[0] }} and the instance
          role must allow s3:GetObject, s3:PutObject and s3:ListBucket on it.
          To use WinRM instead set aws.windows_connection to "winrm" and open 5985/5986.
        success_msg: "SSM file transfer bucket: {{ (aws | default({})).get('ssm_bucket_name', '') }}"
      when: ((aws | default({})).get('windows_connection', 'ssm')) == 'ssm'

    # The Windows sensor is a native .exe. There is no container-pull like
    # Linux, so the installer must come from ONE of two places: a URL the host
    # downloads from the CLMS (preferred), or a pre-staged local file. When
    # neither resolves, the run used to die at the copy step with a bare "file
    # not found", which is why Windows never registered. Fail here instead,
    # naming both fixes, before anything connects.
    - name: A Windows sensor installer must be available (URL or local file)
      ansible.builtin.assert:
        that:
          - >-
            (((windows | default({})).get('installer_url', '') | default('', true)) | length > 0)
            or (lookup('ansible.builtin.fileglob', local_installer_path, errors='ignore') | length > 0)
        fail_msg: >-
          No Windows sensor installer is available. Supply ONE of these in
          customer_input.yaml:
          windows: {installer_url: "https://<clms-ip>/<path>"}   (get the path from
          the CloudLens Manager: Launch Agent -> Start New Agents -> the Windows
          agents link), OR
          windows: {installer_path: "files/cloudlens-win-sensor-X.Y.Z.exe"} pointing
          at an installer you have already downloaded onto this machine.
          Note: Windows is also covered agentlessly by AWS VPC Traffic Mirroring,
          so the sensor is additive, not required for visibility.
        success_msg: >-
          Windows installer source:
          {{ 'URL ' + windows.installer_url if ((windows | default({})).get('installer_url','') | length > 0)
             else 'local file ' + local_installer_path }}

- name: Deploy CloudLens Agent to Windows VMs
  hosts: "{{ target_group }}"
  become: no
  vars_files:
    - ../vars/cloudlens.yaml

  tasks:
    - name: Ensure C:\temp directory exists
      win_file:
        path: C:\temp
        state: directory

    - name: Copy CA certificate to the Windows VM
      win_copy:
        src: "{{ local_ca_path }}"
        dest: C:\temp\cloudlens_ca.crt
      when: ssl_verify == "yes"

    - name: Import CA cert into Trusted Root Certification Authorities
      win_certificate_store:
        path: C:\temp\cloudlens_ca.crt
        store_name: Root
        state: present
      when: ssl_verify == "yes"

    - name: Check if CloudLens Agent is installed
      win_shell: |
        $paths = @(
          "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
          "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
        )
        $found = Get-ItemProperty $paths -ErrorAction SilentlyContinue | 
          Where-Object { $_.DisplayName -like "*CloudLens*" }
        if ($found) {
          Write-Output "FOUND"
          Write-Output "Version: $($found.DisplayVersion)"
        } else {
          Write-Output "NOT_FOUND"
        }
      register: cloudlens_check
      changed_when: false

    - name: Display existing installation status
      debug:
        var: cloudlens_check.stdout_lines

    - name: Check if CloudLens is healthy
      win_shell: |
        $service = Get-Service -Name CloudLens -ErrorAction SilentlyContinue
        $process = Get-Process | Where-Object { $_.ProcessName -like "*CloudLens*" }
        $config = Test-Path "C:\ProgramData\CloudLens\Config\agent.yml"
        
        Write-Output "Service Status: $($service.Status)"
        Write-Output "Process Running: $([bool]$process)"
        Write-Output "Config Exists: $config"
        
        if ($service.Status -eq "Running" -and $process -and $config) {
          Write-Output "HEALTHY"
          exit 0
        } else {
          Write-Output "UNHEALTHY"
          exit 1
        }
      register: cloudlens_health
      when: "'FOUND' in cloudlens_check.stdout"
      changed_when: false
      failed_when: false

    - name: Display health check results
      debug:
        var: cloudlens_health.stdout_lines
      when: cloudlens_health is defined

    - name: Skip reinstall if already healthy
      debug:
        msg: "✓ CloudLens is already installed and running properly - skipping reinstall"
      when:
        - "'FOUND' in cloudlens_check.stdout"
        - cloudlens_health.rc == 0

    - name: Proceed with installation/reinstallation
      when: 
        - "'NOT_FOUND' in cloudlens_check.stdout or (cloudlens_health is defined and cloudlens_health.rc != 0)"
      block:
        - name: Stop CloudLens service if running
          win_shell: |
            $service = Get-Service -Name CloudLens -ErrorAction SilentlyContinue
            if ($service) {
              if ($service.Status -eq "Running") {
                Stop-Service -Name CloudLens -Force
                Write-Output "Service stopped"
              } else {
                Write-Output "Service exists but not running"
              }
            } else {
              Write-Output "Service does not exist"
            }
          when: "'FOUND' in cloudlens_check.stdout"

        - name: Kill CloudLens processes
          win_shell: |
            $procs = Get-Process | Where-Object { $_.ProcessName -like "*CloudLens*" }
            if ($procs) {
              $procs | Stop-Process -Force
              Write-Output "Killed $($procs.Count) processes"
            }
          when: "'FOUND' in cloudlens_check.stdout"
          ignore_errors: yes

        - name: Uninstall existing CloudLens Agent
          win_shell: |
            $paths = @(
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
            )
            $apps = Get-ItemProperty $paths -ErrorAction SilentlyContinue | 
              Where-Object { $_.DisplayName -like "*CloudLens*" }
            
            if (-not $apps) {
              Write-Output "Nothing to uninstall"
              exit 0
            }
            
            foreach ($app in $apps) {
              Write-Output "Uninstalling: $($app.DisplayName)"
              $uninstallLines = $app.UninstallString -split "`n"
              
              # MSI
              $msiLine = $uninstallLines | Where-Object { $_ -match "MsiExec" } | Select-Object -First 1
              if ($msiLine -and $msiLine -match '\{([A-F0-9-]+)\}') {
                $productCode = $matches[1]
                Write-Output "MSI: {$productCode}"
                $proc = Start-Process msiexec.exe -ArgumentList "/x {$productCode} /quiet /norestart" -Wait -PassThru
                Write-Output "Exit: $($proc.ExitCode)"
              }
              
              # EXE
              $exeLine = $uninstallLines | Where-Object { $_ -match "\.exe" } | Select-Object -First 1
              if ($exeLine) {
                $exePath = $exeLine.Trim().Trim('"')
                if (Test-Path $exePath) {
                  Write-Output "EXE: $exePath"
                  $proc = Start-Process -FilePath $exePath -ArgumentList "/uninstall /quiet" -Wait -PassThru
                  Write-Output "Exit: $($proc.ExitCode)"
                }
              }
            }
            exit 0
          when: "'FOUND' in cloudlens_check.stdout"

        - name: Wait for uninstall
          ansible.builtin.pause:
            seconds: 30
          when: "'FOUND' in cloudlens_check.stdout"

        - name: Force remove registry entries
          win_shell: |
            $paths = @(
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall",
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall"
            )
            foreach ($path in $paths) {
              Get-ChildItem $path -ErrorAction SilentlyContinue | ForEach-Object {
                $props = Get-ItemProperty $_.PSPath
                if ($props.DisplayName -like "*CloudLens*") {
                  Remove-Item $_.PSPath -Force -ErrorAction SilentlyContinue
                }
              }
            }
          when: "'FOUND' in cloudlens_check.stdout"
          ignore_errors: yes

        - name: Remove program directory only
          win_file:
            path: C:\Program Files\Keysight\CloudLens
            state: absent
          ignore_errors: yes

        # Preferred: the host pulls the installer straight from the CLMS. This
        # is the documented flow and avoids staging a large .exe through the
        # SSM S3 bucket. SSL_Verify=no in the install args mirrors a CLMS with
        # a self-signed cert, so validate_certs is off to match.
        - name: Download CloudLens installer from the CLMS (when a URL is given)
          win_get_url:
            url: "{{ cloudlens_installer_url }}"
            dest: C:\temp\{{ cloudlens_installer_filename }}
            validate_certs: "{{ ssl_verify == 'yes' }}"
          when: cloudlens_installer_url | length > 0

        # Fallback: copy a pre-staged installer from the Ansible controller.
        - name: Transfer CloudLens installer from a local file (when no URL)
          win_copy:
            src: "{{ local_installer_path }}"
            dest: C:\temp\{{ cloudlens_installer_filename }}
          when: cloudlens_installer_url | length == 0

        - name: Verify installer exists
          win_stat:
            path: C:\temp\{{ cloudlens_installer_filename }}
          register: installer_file
          failed_when: not installer_file.stat.exists

        - name: Display installer size
          debug:
            msg: "Installer: {{ (installer_file.stat.size / 1024 / 1024) | round(2) }} MB"

        - name: Install CloudLens Agent
          win_shell: |
            $installerPath = "C:\temp\{{ cloudlens_installer_filename }}"
            $arguments = @(
              "/install"
              "/quiet"
              'Server="{{ cloudlens_manager_ip_or_FQDN }}"'
              'Project_Key="{{ project_key }}"'
              'SSL_Verify="{{ ssl_verify }}"'
              'Auto_Update="{{ auto_update }}"'
              'Custom_Tags="{{ custom_tags }}"'
            )
            
            Write-Output "Installing CloudLens..."
            $process = Start-Process -FilePath $installerPath -ArgumentList $arguments -Wait -PassThru
            Write-Output "Exit code: $($process.ExitCode)"
            
            if ($process.ExitCode -in @(0, 3010, 1641)) {
              exit 0
            } else {
              exit $process.ExitCode
            }
          register: install_result
          failed_when: install_result.rc not in [0, 3010, 1641]

        - name: Display installation result
          debug:
            var: install_result.stdout_lines

        - name: Wait for service initialization
          ansible.builtin.pause:
            seconds: 60

        - name: Wait for config file creation
          win_shell: |
            $configPath = "C:\ProgramData\CloudLens\Config\agent.yml"
            $maxWait = 30
            $waited = 0
            
            while ($waited -lt $maxWait) {
              if (Test-Path $configPath) {
                Write-Output "Config created after $waited seconds"
                exit 0
              }
              Start-Sleep -Seconds 2
              $waited += 2
            }
            Write-Output "WARNING: Config not created"
            exit 1
          failed_when: false

    - name: Check CloudLens service status
      win_shell: |
        for ($i = 1; $i -le 10; $i++) {
          Write-Output "Check $i/10"
          $service = Get-Service -Name "CloudLens" -ErrorAction SilentlyContinue
          if ($service) {
            Write-Output "Service: $($service.Status)"
            if ($service.Status -ne "Running") {
              Start-Service -Name CloudLens -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 5
              $service = Get-Service -Name CloudLens
            }
            if ($service.Status -eq "Running") {
              Write-Output "SUCCESS: Running"
              exit 0
            }
            break
          }
          Start-Sleep -Seconds 5
        }
        Write-Output "WARNING: Not running"
        exit 0
      register: service_check
      changed_when: false

    - name: Check process
      win_shell: |
        Start-Sleep -Seconds 5
        $process = Get-Process | Where-Object { $_.ProcessName -like "*CloudLens*" }
        if ($process) {
          $process | ForEach-Object { Write-Output "$($_.ProcessName) - PID: $($_.Id)" }
          exit 0
        } else {
          Write-Output "No process"
          exit 1
        }
      register: process_check
      changed_when: false
      failed_when: false

    - name: Verify registry
      win_shell: |
        $paths = @(
          "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
          "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
        )
        $app = Get-ItemProperty $paths -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*CloudLens*" }
        if ($app) {
          Write-Output "Version: $($app.DisplayVersion)"
          exit 0
        } else {
          Write-Output "Not in registry"
          exit 1
        }
      register: registry_check
      changed_when: false
      failed_when: registry_check.rc != 0

    - name: Check config file
      win_shell: |
        if (Test-Path "C:\ProgramData\CloudLens\Config\agent.yml") {
          Write-Output "Config exists"
          Get-Content "C:\ProgramData\CloudLens\Config\agent.yml" | Select-Object -First 15
        } else {
          Write-Output "Config missing"
        }
      register: config_check
      changed_when: false
      ignore_errors: true

    - name: Display config
      debug:
        var: config_check.stdout_lines

    - name: Final status
      debug:
        msg: |
          CloudLens Deployment
          ====================
          Service: {{ 'RUNNING' if service_check.rc == 0 else 'NOT RUNNING' }}
          Process: {{ 'YES' if process_check.rc == 0 else 'NO' }}
          Registry: {{ 'PRESENT' if registry_check.rc == 0 else 'MISSING' }}
          Config: {{ 'EXISTS' if 'Config exists' in config_check.stdout else 'MISSING' }}
          
          Result: {{ 'SUCCESS' if (service_check.rc == 0 and process_check.rc == 0 and 'Config exists' in config_check.stdout) else 'PARTIAL' }}

    - name: Clean up installer log files
      win_shell: |
        Get-ChildItem "C:\temp" -Filter "*cloudlens*" -File | Where-Object { $_.Name -like "*.log*" -or $_.Name -eq "cloudlens_uninstall" } | ForEach-Object {
          Remove-Item $_.FullName -Force -ErrorAction SilentlyContinue
        }
        Write-Output "Cleaned up CloudLens log files"
      ignore_errors: true      