Conditions:
  ExistingVPC: !Not [!Equals [!Ref ExistingVpcId, ""]]
  CreateVpc: !Not [Condition: ExistingVPC]
  DeployKVO: !Equals [!Ref DeployKVO, "yes"]
  DeployVPB: !Equals [!Ref DeployVPB, "yes"]
  WithPublicIp: !Equals [!Ref AssignPublicIp, "yes"]
  CreateSecurityGroup: !Equals [!Ref ExistingSecurityGroupId, ""]
  CreateKeyPair: !Equals [!Ref KeyPairAction, "Create a new key pair for me"]
  CustomVcontrollerName: !Not [!Equals [!Ref VcontrollerName, ""]]
  CustomKvoName: !Not [!Equals [!Ref KvoName, ""]]
  CustomVpbName: !Not [!Equals [!Ref VpbName, ""]]
  UseDataSubnet: !Not [!Equals [!Ref ExistingDataSubnetId, ""]]
  TestUbuntu: !Equals [!Ref DeployTestWorkloadUbuntu, "yes"]
  TestRhel: !Equals [!Ref DeployTestWorkloadRhel, "yes"]
  TestWindows: !Equals [!Ref DeployTestWorkloadWindows, "yes"]
  HaveWindowsProfile: !Not [!Equals [!Ref TestWindowsInstanceProfile, ""]]
  AnyTestWorkload: !Or [!Condition TestUbuntu, !Condition TestRhel, !Condition TestWindows]
  # Elastic IPs are per-component AND gated on the public-IP toggle.
  VcontrollerHasEip: !Condition WithPublicIp
  KvoHasEip: !And [!Condition DeployKVO, !Condition WithPublicIp]
  VpbHasEip: !And [!Condition DeployVPB, !Condition WithPublicIp]

Resources:


  Vpc:
    Type: AWS::EC2::VPC
    Condition: CreateVpc
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateVpc
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  MgmtSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref MgmtSubnetCidr
      MapPublicIpOnLaunch: !If [WithPublicIp, true, false]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-mgmt-subnet"

  DataSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref DataSubnetCidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-data-subnet"

  ToolSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref ToolSubnetCidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-tool-subnet"

  RouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-rt"

  DefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateVpc
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  MgmtSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId: !Ref MgmtSubnet
      RouteTableId: !Ref RouteTable

  DataSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId: !Ref DataSubnet
      RouteTableId: !Ref RouteTable

  ToolSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId: !Ref ToolSubnet
      RouteTableId: !Ref RouteTable

  # ---------- Key pair (only when the customer did not name one) ----------
  # EC2 generates the key and stores the PRIVATE key in SSM Parameter Store as
  # a SecureString at /ec2/keypair/<key-pair-id>. The stack outputs the exact
  # command to download it. This is what makes a first-ever deploy possible in
  # an account that has no key pair yet.
  GeneratedKeyPair:
    Type: AWS::EC2::KeyPair
    Condition: CreateKeyPair
    Properties:
      KeyName: !Sub "${AWS::StackName}-key"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-key"

  # ---------- Shared security group (only when one is not supplied) ----------
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateSecurityGroup
    Properties:
      GroupDescription: CloudLens stack access (SSH, vPB SSH, HTTPS, VXLAN)
      VpcId: !If [CreateVpc, !Ref Vpc, !Ref ExistingVpcId]
      SecurityGroupIngress:
        - Description: SSH
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminIngressCidr
        - Description: vPB SSH (KCOS)
          IpProtocol: tcp
          FromPort: 9022
          ToPort: 9022
          CidrIp: !Ref AdminIngressCidr
        - Description: HTTPS UI
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AdminIngressCidr
        - Description: VXLAN standard
          IpProtocol: udp
          FromPort: 4789
          ToPort: 4789
          CidrIp: !Ref AdminIngressCidr
        - Description: VXLAN Keysight
          IpProtocol: udp
          FromPort: 10800
          ToPort: 10801
          CidrIp: !Ref AdminIngressCidr
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-sg"

  # ---------- vController (always) ----------
  VcontrollerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !FindInMap [RegionMap, !Ref "AWS::Region", VcontrollerAmi]
      InstanceType: !Ref VcontrollerInstanceType
      KeyName: !If [CreateKeyPair, !Ref GeneratedKeyPair, !Ref KeyPairName]
      SubnetId: !If [CreateVpc, !Ref MgmtSubnet, !Ref ExistingSubnetId]
      SecurityGroupIds:
        - !If [CreateSecurityGroup, !Ref SecurityGroup, !Ref ExistingSecurityGroupId]
      Tags:
        - Key: Name
          Value: !If [CustomVcontrollerName, !Ref VcontrollerName, !Sub "${AWS::StackName}-vcontroller"]

  # Allocated with no InstanceId so it has no dependency on the instance and
  # CloudFormation claims it immediately. If the account is short on Elastic IP
  # quota the stack fails within seconds, before any instance launches, instead
  # of several minutes in with instance hours already burned.
  VcontrollerEip:
    Type: AWS::EC2::EIP
    Condition: VcontrollerHasEip
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vcontroller-eip"

  VcontrollerEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Condition: VcontrollerHasEip
    Properties:
      AllocationId: !GetAtt VcontrollerEip.AllocationId
      InstanceId: !Ref VcontrollerInstance

  # ---------- KVO (optional) ----------
  KvoInstance:
    Type: AWS::EC2::Instance
    Condition: DeployKVO
    Properties:
      ImageId: !FindInMap [RegionMap, !Ref "AWS::Region", KvoAmi]
      InstanceType: !Ref KvoInstanceType
      KeyName: !If [CreateKeyPair, !Ref GeneratedKeyPair, !Ref KeyPairName]
      SubnetId: !If [CreateVpc, !Ref MgmtSubnet, !Ref ExistingSubnetId]
      SecurityGroupIds:
        - !If [CreateSecurityGroup, !Ref SecurityGroup, !Ref ExistingSecurityGroupId]
      Tags:
        - Key: Name
          Value: !If [CustomKvoName, !Ref KvoName, !Sub "${AWS::StackName}-kvo"]

  # Allocated with no InstanceId so it has no dependency on the instance and
  # CloudFormation claims it immediately. If the account is short on Elastic IP
  # quota the stack fails within seconds, before any instance launches, instead
  # of several minutes in with instance hours already burned.
  KvoEip:
    Type: AWS::EC2::EIP
    Condition: KvoHasEip
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-kvo-eip"

  KvoEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Condition: KvoHasEip
    Properties:
      AllocationId: !GetAtt KvoEip.AllocationId
      InstanceId: !Ref KvoInstance

  # ---------- vPB (optional) ----------
  VpbInstance:
    Type: AWS::EC2::Instance
    Condition: DeployVPB
    Properties:
      ImageId: !FindInMap [RegionMap, !Ref "AWS::Region", VpbAmi]
      InstanceType: !Ref VpbInstanceType
      KeyName: !If [CreateKeyPair, !Ref GeneratedKeyPair, !Ref KeyPairName]
      SourceDestCheck: false
      # vPB lands in the data subnet when one is supplied, else the mgmt/main subnet.
      SubnetId: !If
        - CreateVpc
        - !Ref MgmtSubnet
        - !If [UseDataSubnet, !Ref ExistingDataSubnetId, !Ref ExistingSubnetId]
      SecurityGroupIds:
        - !If [CreateSecurityGroup, !Ref SecurityGroup, !Ref ExistingSecurityGroupId]
      Tags:
        - Key: Name
          Value: !If [CustomVpbName, !Ref VpbName, !Sub "${AWS::StackName}-vpb"]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # Auto-bootstrap (mirrors the Azure CustomScript extension): waits for
          # KCOS, installs system-wide KUBECONFIG and the sudo vpb wrapper so
          # SSH-in just works. Log: /var/log/cloudlens-bootstrap.log
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/Keysight-Tech/cloudlens-ansible-aws/main/scripts/bootstrap-vpb.sh -o /tmp/bootstrap-vpb.sh
          bash /tmp/bootstrap-vpb.sh > /var/log/cloudlens-bootstrap.log 2>&1

  # Allocated with no InstanceId so it has no dependency on the instance and
  # CloudFormation claims it immediately. If the account is short on Elastic IP
  # quota the stack fails within seconds, before any instance launches, instead
  # of several minutes in with instance hours already burned.
  VpbEip:
    Type: AWS::EC2::EIP
    Condition: VpbHasEip
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpb-eip"

  VpbEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Condition: VpbHasEip
    Properties:
      AllocationId: !GetAtt VpbEip.AllocationId
      InstanceId: !Ref VpbInstance

  # ---------- Optional test workloads ----------
  # Plain VMs that exist only to prove the sensor path. They land in THIS
  # stack's subnet, not a separate VPC, so sensors reach vController over the
  # private network and VPC Traffic Mirroring between them and the vPB is
  # actually possible. A fixture in its own VPC cannot demonstrate either.
  TestWorkloadSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: AnyTestWorkload
    Properties:
      GroupDescription: CloudLens test workload VMs
      VpcId: !If [CreateVpc, !Ref Vpc, !Ref ExistingVpcId]
      SecurityGroupIngress:
        - Description: SSH from the admin network
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminIngressCidr
        - Description: RDP from the admin network (Windows)
          IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: !Ref AdminIngressCidr
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-testworkload-sg"

  TestUbuntuInstance:
    Type: AWS::EC2::Instance
    Condition: TestUbuntu
    Properties:
      ImageId: !Ref TestWorkloadUbuntuAmi
      InstanceType: t3.small
      KeyName: !If [CreateKeyPair, !Ref GeneratedKeyPair, !Ref KeyPairName]
      SubnetId: !If [CreateVpc, !Ref MgmtSubnet, !Ref ExistingSubnetId]
      SecurityGroupIds:
        - !Ref TestWorkloadSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-test-ubuntu"
        - Key: !Ref DiscoveryTagKey
          Value: !Ref DiscoveryTagValue
        - Key: os
          Value: ubuntu
        - Key: env
          Value: test

  TestRhelInstance:
    Type: AWS::EC2::Instance
    Condition: TestRhel
    Properties:
      ImageId: !FindInMap [RegionMap, !Ref "AWS::Region", TestRhelAmi]
      InstanceType: t3.small
      KeyName: !If [CreateKeyPair, !Ref GeneratedKeyPair, !Ref KeyPairName]
      SubnetId: !If [CreateVpc, !Ref MgmtSubnet, !Ref ExistingSubnetId]
      SecurityGroupIds:
        - !Ref TestWorkloadSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-test-rhel"
        - Key: !Ref DiscoveryTagKey
          Value: !Ref DiscoveryTagValue
        - Key: os
          Value: rhel
        - Key: env
          Value: test

  TestWindowsInstance:
    Type: AWS::EC2::Instance
    Condition: TestWindows
    Properties:
      ImageId: !Ref TestWorkloadWindowsAmi
      InstanceType: t3.medium
      # Ansible reaches Windows over SSM, which needs this profile on the
      # instance. Omitted entirely when neither created nor supplied.
      IamInstanceProfile: !If
        - HaveWindowsProfile
        - !Ref TestWindowsInstanceProfile
        - !Ref "AWS::NoValue"
      KeyName: !If [CreateKeyPair, !Ref GeneratedKeyPair, !Ref KeyPairName]
      SubnetId: !If [CreateVpc, !Ref MgmtSubnet, !Ref ExistingSubnetId]
      SecurityGroupIds:
        - !Ref TestWorkloadSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-test-windows"
        - Key: !Ref DiscoveryTagKey
          Value: !Ref DiscoveryTagValue
        - Key: os
          Value: windows
        - Key: env
          Value: test

Outputs:
  SharedVpcId:
    Description: VPC the stack deployed into.
    Value: !If [CreateVpc, !Ref Vpc, !Ref ExistingVpcId]
  KeyPairUsed:
    Description: EC2 key pair the instances were launched with.
    Value: !If [CreateKeyPair, !Ref GeneratedKeyPair, !Ref KeyPairName]
  DownloadPrivateKeyCommand:
    Condition: CreateKeyPair
    Description: >
      The stack created a key pair for you. Run this to download the private
      key, then chmod 400 it before using it with ssh.
    Value: !Sub
      - "aws ssm get-parameter --name /ec2/keypair/${KeyId} --region ${AWS::Region} --with-decryption --query Parameter.Value --output text > ${AWS::StackName}-key.pem && chmod 400 ${AWS::StackName}-key.pem"
      - KeyId: !GetAtt GeneratedKeyPair.KeyPairId
  AccessMode:
    Description: How the instances are reachable.
    Value: !If
      - WithPublicIp
      - "Public Elastic IPs assigned. Reach the UIs over the internet."
      - "Private IPs only. Reach the UIs over VPN / Direct Connect / VPC peering."
  VcontrollerAddress:
    Description: Reachable address of the vController (public EIP if assigned, else private IP).
    Value: !If [VcontrollerHasEip, !Ref VcontrollerEip, !GetAtt VcontrollerInstance.PrivateIp]
  VcontrollerPrivateIp:
    Description: Private IP of the vController instance.
    Value: !GetAtt VcontrollerInstance.PrivateIp
  VcontrollerUiUrl:
    Description: vController web UI URL. Default login admin / Cl0udLens@dm!n (change on first login).
    Value: !If
      - VcontrollerHasEip
      - !Sub "https://${VcontrollerEip}"
      - !Sub
        - "https://${Ip}"
        - Ip: !GetAtt VcontrollerInstance.PrivateIp
  KvoAddress:
    Condition: DeployKVO
    Description: Reachable address of the KVO (public EIP if assigned, else private IP).
    Value: !If [KvoHasEip, !Ref KvoEip, !GetAtt KvoInstance.PrivateIp]
  KvoPrivateIp:
    Condition: DeployKVO
    Description: Private IP of the KVO instance.
    Value: !GetAtt KvoInstance.PrivateIp
  KvoUiUrl:
    Condition: DeployKVO
    Description: KVO web UI URL.
    Value: !If
      - KvoHasEip
      - !Sub "https://${KvoEip}"
      - !Sub
        - "https://${Ip}"
        - Ip: !GetAtt KvoInstance.PrivateIp
  VpbAddress:
    Condition: DeployVPB
    Description: Reachable address of the vPB (public EIP if assigned, else private IP).
    Value: !If [VpbHasEip, !Ref VpbEip, !GetAtt VpbInstance.PrivateIp]
  VpbPrivateIp:
    Condition: DeployVPB
    Description: Private IP of the vPB instance.
    Value: !GetAtt VpbInstance.PrivateIp
  VpbUiUrl:
    Condition: DeployVPB
    Description: vPB web UI URL.
    Value: !If
      - VpbHasEip
      - !Sub "https://${VpbEip}"
      - !Sub
        - "https://${Ip}"
        - Ip: !GetAtt VpbInstance.PrivateIp
  VpbSshCommand:
    Condition: DeployVPB
    Description: SSH command for the vPB instance (port 9022).
    Value: !If
      - VpbHasEip
      - !Sub "ssh -i <your-key>.pem -p 9022 admin@${VpbEip}"
      - !Sub
        - "ssh -i <your-key>.pem -p 9022 admin@${Ip}  (reachable over VPN/peering)"
        - Ip: !GetAtt VpbInstance.PrivateIp
  TestWorkloadsDeployed:
    Condition: AnyTestWorkload
    Description: Test VMs created by this stack, tagged for sensor discovery.
    Value: !Sub
      - "tag ${K}=${V} | ubuntu:${U} rhel:${R} windows:${W}"
      - K: !Ref DiscoveryTagKey
        V: !Ref DiscoveryTagValue
        U: !If [TestUbuntu, !GetAtt TestUbuntuInstance.PrivateIp, "-"]
        R: !If [TestRhel, !GetAtt TestRhelInstance.PrivateIp, "-"]
        W: !If [TestWindows, !GetAtt TestWindowsInstance.PrivateIp, "-"]
  NextSteps:
    Description: What to do after the stack finishes.
    Value: >
      Allow about 15 minutes for full initialization. Open the vController UI,
      log in with admin / Cl0udLens@dm!n, create a Project, and copy the project
      key. Then run the sensor installer from the repo quickstart to register
      workloads. Marketplace subscription to all CloudLens AMIs is required. When
      deployed with private IPs, ensure the subnet has outbound internet (NAT or
      VPC endpoints) or first-boot Marketplace activation and bootstrap will hang.
