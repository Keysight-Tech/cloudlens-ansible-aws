Conditions:
  ExistingVPC: !Not [!Equals [!Ref ExistingVpcId, ""]]
  CreateVpc: !Not [Condition: ExistingVPC]
  DeployKVO: !Equals [!Ref DeployKVO, "yes"]
  DeployVPB: !Equals [!Ref DeployVPB, "yes"]
  WithPublicIp: !Equals [!Ref AssignPublicIp, "yes"]
  CreateSecurityGroup: !Equals [!Ref ExistingSecurityGroupId, ""]
  UseDataSubnet: !Not [!Equals [!Ref ExistingDataSubnetId, ""]]
  # Elastic IPs are per-component AND gated on the public-IP toggle.
  VcontrollerHasEip: !Condition WithPublicIp
  KvoHasEip: !And [!Condition DeployKVO, !Condition WithPublicIp]
  VpbHasEip: !And [!Condition DeployVPB, !Condition WithPublicIp]

Resources:
  # ---------- Shared network (only when creating a new VPC) ----------
  Vpc:
    Type: AWS::EC2::VPC
    Condition: CreateVpc
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateVpc
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  MgmtSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref MgmtSubnetCidr
      MapPublicIpOnLaunch: !If [WithPublicIp, true, false]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-mgmt-subnet"

  DataSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref DataSubnetCidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-data-subnet"

  ToolSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref ToolSubnetCidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-tool-subnet"

  RouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-rt"

  DefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateVpc
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  MgmtSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId: !Ref MgmtSubnet
      RouteTableId: !Ref RouteTable

  DataSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId: !Ref DataSubnet
      RouteTableId: !Ref RouteTable

  ToolSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId: !Ref ToolSubnet
      RouteTableId: !Ref RouteTable

  # ---------- Shared security group (only when one is not supplied) ----------
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateSecurityGroup
    Properties:
      GroupDescription: CloudLens stack access (SSH, vPB SSH, HTTPS, VXLAN)
      VpcId: !If [CreateVpc, !Ref Vpc, !Ref ExistingVpcId]
      SecurityGroupIngress:
        - Description: SSH
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminIngressCidr
        - Description: vPB SSH (KCOS)
          IpProtocol: tcp
          FromPort: 9022
          ToPort: 9022
          CidrIp: !Ref AdminIngressCidr
        - Description: HTTPS UI
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AdminIngressCidr
        - Description: VXLAN standard
          IpProtocol: udp
          FromPort: 4789
          ToPort: 4789
          CidrIp: !Ref AdminIngressCidr
        - Description: VXLAN Keysight
          IpProtocol: udp
          FromPort: 10800
          ToPort: 10801
          CidrIp: !Ref AdminIngressCidr
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-sg"

  # ---------- vController (always) ----------
  VcontrollerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !FindInMap [RegionMap, !Ref "AWS::Region", VcontrollerAmi]
      InstanceType: !Ref VcontrollerInstanceType
      KeyName: !Ref KeyPairName
      SubnetId: !If [CreateVpc, !Ref MgmtSubnet, !Ref ExistingSubnetId]
      SecurityGroupIds:
        - !If [CreateSecurityGroup, !Ref SecurityGroup, !Ref ExistingSecurityGroupId]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vcontroller"

  VcontrollerEip:
    Type: AWS::EC2::EIP
    Condition: VcontrollerHasEip
    Properties:
      Domain: vpc
      InstanceId: !Ref VcontrollerInstance
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vcontroller-eip"

  # ---------- KVO (optional) ----------
  KvoInstance:
    Type: AWS::EC2::Instance
    Condition: DeployKVO
    Properties:
      ImageId: !FindInMap [RegionMap, !Ref "AWS::Region", KvoAmi]
      InstanceType: !Ref KvoInstanceType
      KeyName: !Ref KeyPairName
      SubnetId: !If [CreateVpc, !Ref MgmtSubnet, !Ref ExistingSubnetId]
      SecurityGroupIds:
        - !If [CreateSecurityGroup, !Ref SecurityGroup, !Ref ExistingSecurityGroupId]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-kvo"

  KvoEip:
    Type: AWS::EC2::EIP
    Condition: KvoHasEip
    Properties:
      Domain: vpc
      InstanceId: !Ref KvoInstance
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-kvo-eip"

  # ---------- vPB (optional) ----------
  VpbInstance:
    Type: AWS::EC2::Instance
    Condition: DeployVPB
    Properties:
      ImageId: !FindInMap [RegionMap, !Ref "AWS::Region", VpbAmi]
      InstanceType: !Ref VpbInstanceType
      KeyName: !Ref KeyPairName
      SourceDestCheck: false
      # vPB lands in the data subnet when one is supplied, else the mgmt/main subnet.
      SubnetId: !If
        - CreateVpc
        - !Ref MgmtSubnet
        - !If [UseDataSubnet, !Ref ExistingDataSubnetId, !Ref ExistingSubnetId]
      SecurityGroupIds:
        - !If [CreateSecurityGroup, !Ref SecurityGroup, !Ref ExistingSecurityGroupId]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpb"
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # Auto-bootstrap (mirrors the Azure CustomScript extension): waits for
          # KCOS, installs system-wide KUBECONFIG and the sudo vpb wrapper so
          # SSH-in just works. Log: /var/log/cloudlens-bootstrap.log
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/Keysight-Tech/cloudlens-ansible-aws/main/scripts/bootstrap-vpb.sh -o /tmp/bootstrap-vpb.sh
          bash /tmp/bootstrap-vpb.sh > /var/log/cloudlens-bootstrap.log 2>&1

  VpbEip:
    Type: AWS::EC2::EIP
    Condition: VpbHasEip
    Properties:
      Domain: vpc
      InstanceId: !Ref VpbInstance
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpb-eip"

Outputs:
  SharedVpcId:
    Description: VPC the stack deployed into.
    Value: !If [CreateVpc, !Ref Vpc, !Ref ExistingVpcId]
  AccessMode:
    Description: How the instances are reachable.
    Value: !If
      - WithPublicIp
      - "Public Elastic IPs assigned. Reach the UIs over the internet."
      - "Private IPs only. Reach the UIs over VPN / Direct Connect / VPC peering."
  VcontrollerAddress:
    Description: Reachable address of the vController (public EIP if assigned, else private IP).
    Value: !If [VcontrollerHasEip, !Ref VcontrollerEip, !GetAtt VcontrollerInstance.PrivateIp]
  VcontrollerPrivateIp:
    Description: Private IP of the vController instance.
    Value: !GetAtt VcontrollerInstance.PrivateIp
  VcontrollerUiUrl:
    Description: vController web UI URL. Default login admin / Cl0udLens@dm!n (change on first login).
    Value: !If
      - VcontrollerHasEip
      - !Sub "https://${VcontrollerEip}"
      - !Sub
        - "https://${Ip}"
        - Ip: !GetAtt VcontrollerInstance.PrivateIp
  KvoAddress:
    Condition: DeployKVO
    Description: Reachable address of the KVO (public EIP if assigned, else private IP).
    Value: !If [KvoHasEip, !Ref KvoEip, !GetAtt KvoInstance.PrivateIp]
  KvoPrivateIp:
    Condition: DeployKVO
    Description: Private IP of the KVO instance.
    Value: !GetAtt KvoInstance.PrivateIp
  KvoUiUrl:
    Condition: DeployKVO
    Description: KVO web UI URL.
    Value: !If
      - KvoHasEip
      - !Sub "https://${KvoEip}"
      - !Sub
        - "https://${Ip}"
        - Ip: !GetAtt KvoInstance.PrivateIp
  VpbAddress:
    Condition: DeployVPB
    Description: Reachable address of the vPB (public EIP if assigned, else private IP).
    Value: !If [VpbHasEip, !Ref VpbEip, !GetAtt VpbInstance.PrivateIp]
  VpbPrivateIp:
    Condition: DeployVPB
    Description: Private IP of the vPB instance.
    Value: !GetAtt VpbInstance.PrivateIp
  VpbUiUrl:
    Condition: DeployVPB
    Description: vPB web UI URL.
    Value: !If
      - VpbHasEip
      - !Sub "https://${VpbEip}"
      - !Sub
        - "https://${Ip}"
        - Ip: !GetAtt VpbInstance.PrivateIp
  VpbSshCommand:
    Condition: DeployVPB
    Description: SSH command for the vPB instance (port 9022).
    Value: !If
      - VpbHasEip
      - !Sub "ssh -i <your-key>.pem -p 9022 admin@${VpbEip}"
      - !Sub
        - "ssh -i <your-key>.pem -p 9022 admin@${Ip}  (reachable over VPN/peering)"
        - Ip: !GetAtt VpbInstance.PrivateIp
  NextSteps:
    Description: What to do after the stack finishes.
    Value: >
      Allow about 15 minutes for full initialization. Open the vController UI,
      log in with admin / Cl0udLens@dm!n, create a Project, and copy the project
      key. Then run the sensor installer from the repo quickstart to register
      workloads. Marketplace subscription to all CloudLens AMIs is required. When
      deployed with private IPs, ensure the subnet has outbound internet (NAT or
      VPC endpoints) or first-boot Marketplace activation and bootstrap will hang.
