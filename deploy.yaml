---
- name: Verify customer config and prerequisites
  hosts: localhost
  gather_facts: false
  tasks:
    - include_vars:
        file: customer_input.yaml
        name: customer

    - name: Check CLMS manager is reachable
      uri:
        url: "https://{{ customer.cloudlens.manager_ip_or_fqdn }}/health"
        validate_certs: false
        timeout: 10
        status_code: [200, 401, 403]
      register: clms_check
      retries: 3
      delay: 5
      ignore_errors: true

    - debug:
        msg: "CLMS {{ customer.cloudlens.manager_ip_or_fqdn }} - {{ 'reachable' if clms_check is success else 'NOT reachable (check SG + DNS)' }}"

# Resolve Linux hosts AWS could not identify BEFORE anything targets them.
# A customer fleet has no os tag, so without this those hosts sit in a group
# nothing installs to, and the run reports success having done nothing.
- import_playbook: playbooks/classify.yaml

# Target the os_* groups, not the *_prod_vms ones.
#
# The old targets required BOTH an os tag and env == prod. That is a lab
# convention, not something a customer fleet has: discovery would find two
# hundred instances, match none of them, and report success. The os_* groups
# are populated three ways, in order of authority: an explicit os tag, what AWS
# itself reports (platform / platform_details), and failing both, the probe in
# classify.yaml. Tagged fleets keep working exactly as before.
- import_playbook: playbooks/ubuntu.yaml
  vars:
    target_group: os_ubuntu

- import_playbook: playbooks/redhat.yaml
  vars:
    target_group: os_rhel

# The Windows SENSOR is off by default. Windows traffic is already captured
# agentlessly by AWS VPC Traffic Mirroring, verified packet by packet, so the
# sensor is additive rather than required. Left on, its prerequisites (an S3
# bucket for SSM file transfer, an installer URL, a working aws_ssm connection
# plugin) turned a run whose Linux sensors had all succeeded into a red failed=1
# recap, which reads as "the deployment failed" when nothing of substance did.
#
# Turn it on deliberately with either:
#   CLOUDLENS_WINDOWS_SENSOR=true bash quickstart.sh
#   windows: {enabled: true}      in customer_input.yaml
- import_playbook: playbooks/windows.yaml
  vars:
    target_group: os_windows
  when: (cloudlens_windows_sensor | default(false)) | bool
